<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teams List</title>
     <link rel="stylesheet" href="/style.css">
     
    
</head>
<body>
    <div style="text-align:center;">
        <h2>Ice Hockey Teams</h2>
        <a href="/team-page/add-team" 
           style="display:inline-block; background-color:#007bff; color:white; padding:10px 15px; border-radius:5px; text-decoration:none; margin-bottom:20px;">
            Add New Team
        </a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Team ID</th>
                <th>Team Name</th>
                <th>City</th>
                <th>Founded</th>
                <th>Coach</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="team : ${teams}">
                <td th:text="${team.teamId}"></td>
                <td th:text="${team.teamName}"></td>
                <td th:text="${team.teamCity}"></td>
                <td th:text="${team.teamFounded}"></td>
                <td th:text="${team.coachName}"></td>
                <td>
				    <a th:href="@{/team-page/edit/{id}(id=${team.teamId})}"
				       style="color:#007bff; text-decoration:none;">Edit</a> |
				
				    <a th:href="@{/team-page/delete/{id}(id=${team.teamId})}"
				       style="color:red; text-decoration:none;"
				       onclick="return confirm('Are you sure you want to delete this team?');">
				       Delete
				    </a>
				</td>

            </tr>
        </tbody>
    </table>
</body>

</html>
