<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Team</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h2 style="text-align:center;">Add New Team</h2>
    
    <form th:action="@{/team-page/save-team}" th:object="${team}" method="post">
        <label for="teamId">Team ID:</label>
        <input type="number" id="teamId" th:field="*{teamId}" required />

        <label for="teamName">Team Name:</label>
        <input type="text" id="teamName" th:field="*{teamName}" required />

        <label for="teamCity">City:</label>
        <input type="text" id="teamCity" th:field="*{teamCity}" required />

        <label for="teamFounded">Founded Year:</label>
        <input type="number" id="teamFounded" th:field="*{teamFounded}" required />

        <label for="coachName">Coach Name:</label>
        <input type="text" id="coachName" th:field="*{coachName}" required />

        <button type="submit">Save Team</button>
        <a href="/team-page/home">Back to Team List</a>
    </form>
</body>
</html>
